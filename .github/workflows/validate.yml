name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests and store registry
        run: python tools/validate.py

      - name: Run validator tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Typecheck module sources
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
