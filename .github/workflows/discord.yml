name: Discord Notification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TITLE="Release: ${{ github.event.release.name }}"
            URL="${{ github.event.release.html_url }}"
            COLOR=16750848
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE="Pull Request: ${{ github.event.pull_request.title }}"
            URL="${{ github.event.pull_request.html_url }}"
            COLOR=16750848
          else
            TITLE="Push: ${{ github.event.head_commit.message }}"
            URL="${{ github.event.head_commit.url }}"
            COLOR=65280
          fi

          AUTHOR_URL="https://github.com/${{ github.repository }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          AUTHOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP="${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.release.published_at }}"

          # Escape JSON special chars in commit message
          TITLE=$(echo "$TITLE" | sed 's/"/\\"/g; s/\/\\/g' | head -c 256)

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"url\": \"$URL\",
                \"color\": $COLOR,
                \"fields\": [
                  {
                    \"name\": \"Repository\",
                    \"value\": \"[aetheris-addons]($AUTHOR_URL)\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Branch\",
                    \"value\": \"$BRANCH\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Author\",
                    \"value\": \"$AUTHOR\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"aetheris-addons | Aetheris Project\",
                  \"icon_url\": \"https://aetheris-web.vercel.app/logo.svg\"
                },
                \"timestamp\": \"$TIMESTAMP\"
              }]
            }"
